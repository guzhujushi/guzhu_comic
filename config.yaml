window:
  title: Guzhu Comic
  width: 1200
  height: 800
  min_size: [800, 600]
  glass: acrylic
  glass_opacity: 0.92
  remember_geometry: true
  last_geometry: [152, 152, 1200, 800]
dev:
  url: http://localhost:5173
  use_dev_server: true
  debug: true
server:
  port: 47753
reader:
  restore_progress: true
  click_to_page: true
  mode: webtoon
  background: dark
  page_gap: 0
  auto_scroll: 0
  width: 1080
detail:
  chapters_collapse: 20
  comment_preview: 5
prefetch:
  albums: 12
  chapter_images: 3
  next_at: 0.9
recommend:
  limit: 10
  candidates: 40
  hot_weight: 0.3
  author_boost: 1.5
  half_life_days: 30
download:
  workers: 8
  dir: ~/.jmreader/downloads
  retries: 3
  auto_resume: true
splash:
  enabled: true
  min_ms: 1950
  max_ms: 3000
update:
  enabled: true
  url: https://code.guzhujushi.cn/guzhujushi/guzhu_comic/raw/branch/main/web
  auto: true
desktop:
  notify: true
  tray: true
  autostart: false
  hotkeys: false
  hotkey_toggle: Ctrl+Alt+G
cache:
  photo_ttl: 86400
  album_ttl: 86400
  search_ttl: 3600
  ranking_ttl: 3600
  comment_ttl: 600
  max_size_mb: 2048
  cleanup_interval: 600
